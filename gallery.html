    <header>
        <p class="logo"><a href="home.html#home"><span>WE HELP</span><span class="hugging-emoji" aria-hidden="true">🫂</span></a></p>

            <div class="search-bar">

            </div>
            <button class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="main-nav">
                <i class="fa-solid fa-bars"></i>
            </button>

    <nav aria-label="Primary">
        <ul id="main-nav">
            <li><a href="home.html#home">Home</a></li>

            <li><a href="books.html#books">Books</a></li>
            <li><a href="contacts.html#contacts">Contacts</a></li>
        </ul>

    <main>
        <section id="gallery">
            <div class="container">
                <h2>Gallery</h2>
                <p class="eyebrow">Moments from our community and the space we're building together.</p>

                <div class="card-grid gallery-grid">
                    <figure>
                        <img src="wehelp-pictures/gallery-3.jpg" alt="Two people sitting together in a supportive conversation" loading="lazy">
                        <figcaption>A safe space to talk, one conversation at a time.</figcaption>
                    </figure>

                    <figure>
                        <img src="wehelp-pictures/gallery-4.jpg" alt="Volunteer answering calls on the support hotline" loading="lazy">
                        <figcaption>Our hotline team, ready around the clock.</figcaption>
                    </figure>

                    <figure>
                        <img src="wehelp-pictures/gallery-6.jpg" alt="Group of people in a peer support circle" loading="lazy">
                        <figcaption>Peer support: you are not the only one.</figcaption>
                    </figure>

                    <figure>
                        <img src="assets/images/gallery-04.jpg" alt="Person journaling quietly in a calm room" loading="lazy">
                        <figcaption>Small, quiet moments of healing matter too.</figcaption>
                    </figure>

                    <figure>
                        <img src="wehelp-pictures/gallery-5.jpg" alt="Therapist and client in a counselling session" loading="lazy">
                        <figcaption>Connecting people with professional care.</figcaption>
                    </figure>

                    <figure>
                        <img src="wehelp-pictures/gallery-7.jpg" alt="Community event hosted by WE HELP" loading="lazy">
                        <figcaption>Building community, together.</figcaption>
                    </figure>
                </div>
            </div>
        </section>
